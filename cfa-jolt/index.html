<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2.57.0?bundle";

const sb=createClient(SUPABASE_URL,SUPABASE_KEY);
const s={user:null,profile:null,checklists:[],items:[],completions:[],temps:[],people:[],screen:"dashboard",filter:"All",selected:null,editor:null,authMode:"login",tempModal:false,pinConfigured:false,busy:false};

function dateInLA(d){const p=new Intl.DateTimeFormat("en-US",{timeZone:"America/Los_Angeles",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(d);let o={};p.forEach(x=>o[x.type]=x.value);return o.year+"-"+o.month+"-"+o.day;}
function weekStart(date){const d=new Date(date+"T12:00:00Z");const day=d.getUTCDay();d.setUTCDate(d.getUTCDate()-((day+6)%7));return d.toISOString().slice(0,10);}
const today=()=>dateInLA(new Date());

const completion=i=>{const c=s.checklists.find(x=>x.id===i.checklist_id);return c?s.completions.find(x=>x.item_id===i.id&&x.service_date===dateKey(c)):null;};
const completedCount=c=>ct(c).filter(i=>completion(i)).length;

function loadingScreen(){app.innerHTML='<div class="auth-right" style="height:100vh"><div><div class="logo-symbol" style="margin:auto">✓</div><p class="muted">Loading CFA Jolt...</p></div></div>';}
async function sync(){
 if(!s.user){s.profile=null;render();return;}
 try{
  const p=await sb.from("profiles").select("*").eq("id",s.user.id).single();
  if(p.error)throw p.error;
  s.profile=p.data;
  s.pinConfigured=false;
  if(s.profile.role==="director"){
   const ps=await sb.rpc("director_pin_status");
   if(ps.error)throw ps.error;
   s.pinConfigured=Boolean(ps.data);
  }
  if(staff()){
   const res=await Promise.all([
    sb.from("checklists").select("*").order("sort_order",{ascending:true}).order("created_at",{ascending:true}),
    sb.from("checklist_items").select("*").order("position",{ascending:true}),
    sb.from("task_completions").select("*").gte("service_date",weekStart(today())),
    sb.from("temperature_logs").select("*").order("recorded_at",{ascending:false}).limit(150),
    manage()?sb.from("profiles").select("*").order("joined_at",{ascending:false}):Promise.resolve({data:[],error:null})
   ]);
   for(const x of res)if(x.error)throw x.error;
   [s.checklists,s.items,s.completions,s.temps,s.people]=res.map(x=>x.data||[]);
  }
  render();
 }catch(e){err(e);render();}
}
function render(){
 if(!s.user){renderAuth();return;}
 if(!s.profile){app.innerHTML='<div class="auth-right" style="height:100vh"><p class="muted">Setting up your profile...</p></div>';return;}
 if(!staff()){renderPending();return;}

 const name=s.profile.full_name||s.user.email.split("@")[0];
 app.innerHTML='<div class="app"><aside class="side"><div class="logo"><div class="logo-symbol">✓</div><span class="logo-label">CFA <span style="color:#ffda72">Jolt</span></span></div><div class="side-section">Workspace</div><nav>'+menu+'</nav><div class="side-bottom"><div style="font-weight:800">'+esc(name)+'</div><div style="color:#facbd5;font-size:12px">'+esc(roleLabel(s.profile.role))+'</div></div></aside><main class="main"><div class="top"><div><div style="font-weight:800;color:#9e0a23">CFA East Cartmill</div><div class="muted small">Restaurant operations workspace</div></div><div class="row"><span class="pill dim">'+esc(roleLabel(s.profile.role))+'</span><button class="btn secondary sm" data-action="signout">Sign out</button></div></div><div class="content">'+screenHtml()+'</div></main></div>'+modalHtml();
}

 const signup=s.authMode==="signup";
 app.innerHTML='<div class="auth-bg"><section class="auth-left"><div class="logo"><div class="logo-symbol">✓</div><span>CFA <span style="color:#ffda72">Jolt</span></span></div><div><div class="eyebrow" style="color:#ffd777">A better way to run the day</div><h1>One team.<br>Every task.<br>Done right.</h1><p style="color:#ffe3eb;max-width:400px;font-size:16px">Checklists, food safety, and accountability — all together in your restaurant\'s own workspace.</p></div><div style="color:#f4cad4;font-size:12px">CFA East Cartmill · Independent operations system</div></section><section class="auth-right"><div class="auth-panel"><div class="mobile-only" style="margin-bottom:30px;font-size:22px;font-weight:800;color:#9e0a23">✓ CFA Jolt</div><div class="eyebrow">Restaurant operations</div><h2>'+(signup?'Create an account':'Welcome back')+'</h2><p class="muted">'+(signup?'Sign up to join your restaurant workspace. An administrator will approve staff access.':'Sign in to your CFA Jolt workspace.')+'</p><form data-form="auth">'+(signup?'<div class="field"><label>Full name</label><input name="name" required maxlength="120" placeholder="Your name"></div>':'')+'<div class="field"><label>Work email</label><input type="email" name="email" autocomplete="email" required placeholder="name@example.com"></div><div class="field"><label>Password</label><input type="password" name="password" autocomplete="'+(signup?'new-password':'current-password')+'" minlength="8" required placeholder="At least 8 characters"></div><button class="btn full" type="submit">'+(signup?'Create account':'Sign in')+'</button></form><div class="divider"></div><p class="muted" style="text-align:center">'+(signup?'Already registered?':'New team member?')+' <button class="btn linklike" data-action="authmode" data-id="'+(signup?'login':'signup')+'">'+(signup?'Sign in':'Create account')+'</button></p><div class="box-note">This is a private restaurant workspace. New accounts do not get access until approved.</div></div></section></div>';
}

 app.innerHTML='<div class="auth-bg"><section class="auth-left"><div class="logo"><div class="logo-symbol">✓</div><span>CFA Jolt</span></div><div><h1>Ready for the next shift.</h1><p style="color:#ffdbe4">Simple tools for a better restaurant day.</p></div><span>Secure staff access</span></section><section class="auth-right"><div class="auth-panel"><div class="eyebrow">Account created</div><h2>Welcome, '+esc(s.profile.full_name||"team member")+'</h2><p class="muted">Your account is waiting for approval from a Director. Please ask your restaurant Director to assign your access level.</p><div class="box-note">Director is the highest access level in CFA Jolt. New accounts remain restricted until approved.</div><div class="divider"></div><div class="row between"><button class="btn secondary" data-action="refresh">Check approval</button><button class="btn secondary" data-action="signout">Sign out</button></div></div></section></div>';
}
function screenHtml(){if(s.screen==="checklists")return checklistsHtml();if(s.screen==="temperatures")return temperaturesHtml();if(s.screen==="team")return teamHtml();if(s.screen==="settings")return settingsHtml();if(s.screen==="detail")return detailHtml();return dashboardHtml();}
function heading(title,sub,button){return '<div class="section-head"><div><div class="eyebrow">CFA Jolt · Operations</div><h1>'+title+'</h1><p class="muted">'+sub+'</p></div>'+(button||"")+'</div>';}

function cardHtml(c){const n=ct(c).length,done=completedCount(c),p=percentage(c);return '<div class="card check-card" data-action="detail" data-id="'+c.id+'"><div class="row between"><div class="check-meta"><span class="pill">'+esc(c.category)+'</span><span class="pill dim">'+esc(c.shift)+'</span></div>'+(p===100&&n?'<span class="pill success">✓ Done</span>':'<span class="pill gold">'+(c.frequency==="weekly"?"Weekly":"Daily")+'</span>')+'</div><h3 style="font-size:17px;margin:0">'+esc(c.title)+'</h3><p class="muted small" style="margin:0;min-height:35px">'+esc(c.description||"Operational checklist")+'</p><div class="progress-info"><strong>'+done+' of '+n+' completed</strong><strong>'+p+'%</strong></div>'+progressBar(p)+'</div>';}
function dashboardHtml(){
 const active=s.checklists.filter(x=>x.active),allItems=active.flatMap(ct),done=allItems.filter(i=>completion(i)).length,rate=allItems.length?Math.round(done/allItems.length*100):0;
 const outstanding=allItems.length-done;
 const stats=[["Task completion",rate+"%","◉","Across active checklists"],["Tasks completed",String(done),"✓","This reporting period"],["Open tasks",String(outstanding),"☷","Remaining checklist items"],["Temperature entries",String(s.temps.filter(t=>dateInLA(new Date(t.recorded_at))===today()).length),"♨","Recorded today"]];

 return heading("Good "+(new Date().getHours()<12?"morning":new Date().getHours()<17?"afternoon":"evening")+".","Here is your restaurant operations overview for "+new Date().toLocaleDateString("en-US",{timeZone:"America/Los_Angeles",weekday:"long",month:"long",day:"numeric"})+".",manage()?'<button class="btn" data-action="edit" data-id="new">+ New checklist</button>':'')+
 '<div class="stat-grid">'+stats.map(a=>'<div class="card"><div class="row between"><span class="stat-label">'+a[0]+'</span><div class="stat-icon">'+a[2]+'</div></div><div class="stat-num">'+a[1]+'</div><span class="muted small">'+a[3]+'</span></div>').join("")+'</div>'+
 '<div class="two-cols"><section class="card"><div class="card-title"><h2 style="margin:0">Checklist progress</h2><button class="btn linklike sm" data-action="nav" data-id="checklists">View all →</button></div>'+(active.length?active.slice(0,8).map(c=>'<div class="chart-line"><div class="progress-info"><strong>'+esc(c.title)+'</strong><span class="muted">'+completedCount(c)+' / '+ct(c).length+'</span></div>'+progressBar(percentage(c))+'</div>').join(""):empty("No checklists yet","Create your first opening, closing, or daily checklist.",manage()?'<button class="btn" data-action="edit" data-id="new">Create a checklist</button>':''))+'</section><section class="card"><div class="card-title"><h2 style="margin:0">Latest food safety logs</h2><button class="btn linklike sm" data-action="nav" data-id="temperatures">View all →</button></div>'+(recent||'<p class="muted">No temperature readings recorded yet.</p>')+'<div class="box-note" style="margin-top:20px">Temperature target limits should always follow your restaurant\'s approved food safety procedures.</div></section></div>';
}

 const visible=s.checklists.filter(c=>(c.active||manage())&&(s.filter==="All"||c.category===s.filter));
 return heading("Digital checklists","Opening, midday, closing and recurring operational procedures.",manage()?'<button class="btn" data-action="edit" data-id="new">+ Create checklist</button>':'')+

 (visible.length?'<div class="check-grid">'+visible.map(cardHtml).join("")+'</div>':empty("No checklists found","Switch filters or create your first checklist.",manage()?'<button class="btn" data-action="edit" data-id="new">Create checklist</button>':''));

 const c=s.checklists.find(x=>x.id===s.selected);if(!c){s.screen="checklists";return checklistsHtml();}
 const its=ct(c);const n=completedCount(c);
 return '<div class="row between wrap" style="margin-bottom:24px"><button class="btn secondary" data-action="nav" data-id="checklists">← All checklists</button>'+(manage()?'<div class="row wrap"><button class="btn secondary sm" data-action="move" data-id="'+c.id+'" data-dir="up">↑ Move up</button><button class="btn secondary sm" data-action="move" data-id="'+c.id+'" data-dir="down">↓ Move down</button><button class="btn secondary sm" data-action="edit" data-id="'+c.id+'">Edit</button><button class="btn warn sm" data-action="archive" data-id="'+c.id+'">'+(c.active?"Archive":"Restore")+'</button></div>':'')+'</div>'+
 '<div class="card" style="max-width:950px"><div class="check-meta" style="margin-bottom:15px"><span class="pill">'+esc(c.category)+'</span><span class="pill dim">'+esc(c.shift)+'</span><span class="pill gold">'+esc(c.frequency)+'</span>'+(c.active?'':'<span class="pill red">Archived</span>')+'</div><h1>'+esc(c.title)+'</h1><p class="muted">'+esc(c.description||"Check off each task as it is completed.")+'</p><div style="margin:24px 0"><div class="progress-info"><strong>'+n+' of '+its.length+' completed</strong><strong>'+percentage(c)+'%</strong></div>'+progressBar(percentage(c))+'</div><div class="divider"></div>'+
 (its.length?its.map(i=>{const r=completion(i);const canUndo=r&&(manage()||r.completed_by===s.user.id);return '<div class="item '+(r?"done":"")+'"><button class="tick '+(r?"done":"")+'" data-action="toggle" data-id="'+i.id+'" '+(r&&!canUndo?"disabled title=\"Completed by another team member\"":"")+'>'+(r?"✓":"")+'</button><div style="flex:1"><div class="item-name">'+esc(i.label)+'</div>'+(r?'<span class="muted tiny">Completed '+fmt(r.completed_at)+' · '+esc(s.people.find(x=>x.id===r.completed_by)?.full_name||"team member")+'</span>':'<span class="muted tiny">Not completed yet</span>')+'</div></div>';}).join(""):'<p class="muted">No tasks in this checklist. Edit to add items.</p>')+'</div>';
}
function temperaturesHtml(){
 const rows=s.temps.slice(0,70).map(t=>{
 const outside=(t.min_f!==null&&Number(t.temperature_f)<Number(t.min_f))||(t.max_f!==null&&Number(t.temperature_f)>Number(t.max_f));
 return '<tr><td><strong>'+esc(t.item_name)+'</strong><div class="muted small">'+esc(t.area)+'</div></td><td>'+esc(t.temperature_f)+'°F</td><td class="muted">'+(t.min_f===null?"—":esc(t.min_f))+' to '+(t.max_f===null?"—":esc(t.max_f))+'°F</td><td><span class="pill '+(outside?"red":"")+'">'+(outside?"Outside range":"Recorded")+'</span></td><td class="muted">'+fmt(t.recorded_at)+'</td><td class="muted">'+esc(t.corrective_action||"—")+'</td></tr>';}).join("");
 return heading("Temperature logs","Record food safety readings and corrective actions.",'<button class="btn" data-action="tempnew">+ Record temperature</button>')+
 '<div class="box-note" style="margin-bottom:20px">Use only your location\'s approved food safety limits. Out-of-range readings require a documented corrective action. This tool is not a substitute for approved safety procedures.</div>'+
 '<div class="card table-wrap">'+(rows?'<table class="table"><thead><tr><th>Item / Area</th><th>Reading</th><th>Target range</th><th>Status</th><th>Recorded</th><th>Corrective action</th></tr></thead><tbody>'+rows+'</tbody></table>':empty("No readings yet","Start by recording a temperature and its approved safe range."))+'</div>';
}
function teamHtml(){
 if(!manage())return dashboardHtml();
 const roles=["pending","team_member","team_leader","manager","director"];
 const rows=s.people.map(p=>{
  const editable=s.profile.role==="director";
  const opts=roles.map(r=>'<option value="'+r+'" '+(p.role===r?'selected':'')+'>'+esc(roleLabel(r))+'</option>').join("");
  return '<tr><td><strong>'+esc(p.full_name||"Unnamed team member")+'</strong><div class="muted small">'+esc(p.id===s.user.id?"You":"Team account")+'</div></td><td><span class="pill '+(p.role==="pending"?"gold":"dim")+'">'+esc(roleLabel(p.role))+'</span></td><td class="muted">'+new Date(p.joined_at).toLocaleDateString()+'</td><td>'+(editable?'<select style="max-width:190px" data-change="role" data-id="'+p.id+'">'+opts+'</select>':'<span class="muted">View only</span>')+'</td></tr>';
 }).join("");
 return heading("Team members","Approve new accounts and manage staff access.",s.profile.role==="director"?'<button class="btn secondary" data-action="nav" data-id="settings">⚙ Director Settings</button>':'')+
 '<div class="box-note" style="margin-bottom:20px">New accounts begin with Pending Approval. Only Directors can change a team member’s role, and role changes require your 6-digit Director PIN. Set yours in Director Settings first.</div>'+
 '<div class="card table-wrap">'+(rows?'<table class="table"><thead><tr><th>Team member</th><th>Access</th><th>Joined</th><th>Change role</th></tr></thead><tbody>'+rows+'</tbody></table>':empty("No team accounts","Ask teammates to create accounts first."))+'</div>';
}
function settingsHtml(){
 if(s.profile?.role!=="director")return dashboardHtml();
 const hasPin=s.pinConfigured;
 const pinInput=(name,label,auto)=>'<div class="field"><label>'+label+'</label><input type="password" inputmode="numeric" pattern="[0-9]{6}" minlength="6" maxlength="6" autocomplete="'+auto+'" name="'+name+'" required placeholder="Enter 6 digits"></div>';
 return heading("Director Settings","Security and administrative access for the highest leadership level.","")+
 '<div class="card" style="max-width:680px"><div class="row between wrap" style="margin-bottom:18px"><div><h2 style="margin:0">Director security PIN</h2><p class="muted small" style="margin:8px 0 0">A personal, customizable 6-digit code.</p></div><span class="pill '+(hasPin?'success':'gold')+'">'+(hasPin?'✓ PIN configured':'Setup needed')+'</span></div>'+
 '<div class="box-note" style="margin-bottom:20px">Your Director PIN is separate from your login password. It is required to approve team members or change their access. Keep it private.</div>'+
 '<form data-form="director-pin">'+(hasPin?pinInput("current_pin","Current 6-digit PIN","current-password"):'')+
 pinInput("new_pin","New 6-digit PIN","new-password")+pinInput("confirm_pin","Confirm new PIN","new-password")+
 '<p class="muted small">Avoid easy-to-guess codes such as 123456 or repeated digits.</p>'+
 '<div class="form-actions"><button class="btn" type="submit">'+(hasPin?'Change Director PIN':'Create Director PIN')+'</button></div></form></div>'+
 '<div class="card" style="max-width:680px;margin-top:18px"><h3>Leadership permissions</h3><p class="muted">Director is the highest role. No Operator role or Operator activation code exists in this app. Only Directors can assign staff permissions.</p><button class="btn secondary" data-action="nav" data-id="team">Manage team members →</button></div>';
}
function modalHtml(){
 if(s.editor!==null){
 const c=s.editor==="new"?null:s.checklists.find(x=>x.id===s.editor);
 const list=c?ct(c).map(x=>x.label).join("\n"):"";
 const sel=(arr,value)=>arr.map(x=>'<option value="'+x+'" '+(value===x?"selected":"")+'>'+x+'</option>').join("");
 return '<div class="modal-back" data-action="backdrop"><div class="modal"><div class="row between"><h2>'+(c?"Edit checklist":"New checklist")+'</h2><button class="btn secondary sm" data-action="close">✕</button></div><form data-form="checklist"><div class="field"><label>Checklist title</label><input name="title" required maxlength="150" minlength="2" value="'+esc(c?.title||"")+'" placeholder="e.g. FOH Opening Checklist"></div><div class="field"><label>Description (optional)</label><input name="description" value="'+esc(c?.description||"")+'" placeholder="What this checklist covers"></div><div class="form-grid"><div class="field"><label>Department</label><select name="category">'+sel(["FOH","BOH","Leadership"],c?.category||"FOH")+'</select></div><div class="field"><label>Repeat</label><select name="frequency">'+sel(["daily","weekly"],c?.frequency||"daily")+'</select></div><div class="field"><label>Shift</label><select name="shift">'+sel(["Anytime","Opening","Midday","Closing"],c?.shift||"Anytime")+'</select></div></div><div class="field"><label>Tasks (one per line)</label><textarea name="tasks" rows="8" required placeholder="Check station supplies&#10;Verify equipment is ready&#10;Complete walkthrough">'+esc(list)+'</textarea><p class="muted small">Each line becomes an individual task. Editing existing lines preserves completion records where possible; removing tasks deletes their history.</p></div><div class="form-actions"><button type="button" class="btn secondary" data-action="close">Cancel</button><button class="btn" type="submit">'+(c?"Save changes":"Create checklist")+'</button></div></form></div></div>';
 }
 if(s.tempModal){
 return '<div class="modal-back" data-action="backdrop"><div class="modal"><div class="row between"><h2>Record temperature</h2><button class="btn secondary sm" data-action="close">✕</button></div><form data-form="temperature"><div class="form-grid"><div class="field"><label>Area / Station</label><input required name="area" placeholder="e.g. Prep Station"></div><div class="field"><label>Food / Equipment</label><input required name="item_name" placeholder="Item being measured"></div><div class="field"><label>Reading (°F)</label><input required type="number" step="0.1" min="-100" max="400" name="temperature_f" placeholder="Measured temperature"></div><div class="field"><label>Approved minimum (°F, optional)</label><input type="number" step="0.1" name="min_f" placeholder="Your approved minimum"></div><div class="field"><label>Approved maximum (°F, optional)</label><input type="number" step="0.1" name="max_f" placeholder="Your approved maximum"></div></div><div class="field"><label>Corrective action / Notes</label><textarea name="corrective_action" rows="3" placeholder="Required if reading is outside your approved range"></textarea></div><div class="form-actions"><button type="button" class="btn secondary" data-action="close">Cancel</button><button class="btn" type="submit">Save reading</button></div></form></div></div>';
 }
 return "";
}
document.addEventListener("click",async ev=>{
 const b=ev.target.closest("[data-action]");if(!b)return;
 const a=b.dataset.action,id=b.dataset.id;
 if(a==="backdrop"&&ev.target!==b)return;
 if(a==="nav"){s.screen=id;s.selected=null;render();window.scrollTo(0,0);}
 if(a==="authmode"){s.authMode=id;render();}
 if(a==="signout"){const {error}=await sb.auth.signOut();if(error)err(error);else{s.user=null;s.profile=null;render();}}
 if(a==="refresh"){await sync();}
 if(a==="filter"){s.filter=id;render();}
 if(a==="detail"){s.screen="detail";s.selected=id;render();window.scrollTo(0,0);}
 if(a==="edit"){s.editor=id;render();}
 if(a==="tempnew"){s.tempModal=true;render();}
 if(a==="close"||a==="backdrop"){s.editor=null;s.tempModal=false;render();}
 if(a==="toggle"){await toggleTask(id);}
 if(a==="archive"){await archiveChecklist(id);}
 if(a==="move"){await moveChecklist(id,b.dataset.dir);}
});
document.addEventListener("change",async ev=>{
 const t=ev.target;
 if(t.dataset.change!=="role")return;
 if(s.profile?.role!=="director"){toast("Only Directors can assign roles.",true);render();return;}
 if(!s.pinConfigured){toast("Create your 6-digit Director PIN in Director Settings first.",true);s.screen="settings";render();return;}
 if(!confirm("Set this team member to "+roleLabel(t.value)+"?")){render();return;}
 const pin=window.prompt("Enter your 6-digit Director PIN to authorize the role change:");
 if(pin===null){render();return;}
 if(!/^[0-9]{6}$/.test(pin)){toast("Enter exactly 6 digits.",true);render();return;}
 const {data,error}=await sb.rpc("set_team_member_role",{p_target:t.dataset.id,p_role:t.value,p_pin:pin});
 if(error){err(error);render();return;}
 const errors={unauthorized:"Only Directors can assign roles.",invalid_role:"Invalid role.",not_found:"Account not found.",last_director:"You cannot remove the last Director.",pin_not_set:"Set your Director PIN first.",incorrect_pin:"Incorrect Director PIN.",locked:"Too many incorrect PIN attempts. Try again in 15 minutes."};
 if(data!=="updated"){toast(errors[data]||"Could not change role.",true);render();return;}
 toast("Role updated.");await sync();
});
document.addEventListener("submit",async ev=>{
 const f=ev.target;if(!f.dataset.form)return;ev.preventDefault();
 const kind=f.dataset.form,submit=f.querySelector('[type="submit"]');if(submit)submit.disabled=true;
 try{
  const x=Object.fromEntries(new FormData(f));
  if(kind==="auth"){
   if(s.authMode==="signup"){
    const {data,error}=await sb.auth.signUp({email:x.email.trim(),password:x.password,options:{data:{full_name:x.name.trim()},emailRedirectTo:window.location.href}});
    if(error)throw error;
    toast(data.session?"Account created.":"Account submitted. Check your email to confirm, then sign in.");
    if(data.session){await initUser();}else{s.authMode="login";render();}
   }else{
    const {error}=await sb.auth.signInWithPassword({email:x.email.trim(),password:x.password});
    if(error)throw error;await initUser();
   }
  }
  if(kind==="director-pin"){
   if(s.profile?.role!=="director")throw new Error("Only Directors can set a PIN.");
   if(!/^[0-9]{6}$/.test(x.new_pin))throw new Error("PIN must be exactly six digits.");
   if(x.new_pin!==x.confirm_pin)throw new Error("New PINs do not match.");
   if(s.pinConfigured&&!/^[0-9]{6}$/.test(x.current_pin||""))throw new Error("Enter your current six-digit PIN.");
   const {data,error}=await sb.rpc("change_director_pin",{p_new_pin:x.new_pin,p_current_pin:s.pinConfigured?x.current_pin:null});
   if(error)throw error;
   const messages={unauthorized:"Only Directors can set a PIN.",invalid_pin_format:"PIN must be exactly six digits.",weak_pin:"Choose a less predictable six-digit PIN.",locked:"Too many incorrect attempts. Try again in 15 minutes.",incorrect_current_pin:"The current PIN is incorrect.",same_pin:"Choose a new PIN different from your existing PIN."};
   if(data!=="created"&&data!=="changed")throw new Error(messages[data]||"Unable to save PIN.");
   toast(data==="created"?"Director PIN created.":"Director PIN changed.");
   await sync();
  }
  if(kind==="checklist"){await saveChecklist(x);}
  if(kind==="temperature"){await saveTemperature(x);}
 }catch(e){err(e);}finally{if(submit&&submit.isConnected)submit.disabled=false;}
});
async function initUser(){const {data,error}=await sb.auth.getUser();if(error&&error.message!=="Auth session missing!"){console.warn(error);}s.user=data?.user||null;await sync();}
async function toggleTask(id){
 const item=s.items.find(x=>x.id===id);if(!item)return;const c=s.checklists.find(x=>x.id===item.checklist_id);if(!c||!c.active)return;
 const done=completion(item);
 if(done){
  if(!manage()&&done.completed_by!==s.user.id){toast("Only the person who completed the task or a manager can undo it.",true);return;}
  const {error}=await sb.from("task_completions").delete().eq("id",done.id);if(error){err(error);return;}
 }else{
  const {error}=await sb.from("task_completions").insert({item_id:id,service_date:dateKey(c)});if(error){err(error);return;}
 }
 await sync();
}
async function archiveChecklist(id){
 const c=s.checklists.find(x=>x.id===id);if(!c)return;
 if(!confirm((c.active?"Archive":"Restore")+" "+c.title+"?"))return;
 const {error}=await sb.from("checklists").update({active:!c.active}).eq("id",id);
 if(error)err(error);else{toast(c.active?"Checklist archived.":"Checklist restored.");await sync();}
}
async function moveChecklist(id,dir){
 const c=s.checklists.find(x=>x.id===id);if(!c)return;
 const group=s.checklists.filter(x=>x.category===c.category).sort((a,b)=>a.sort_order-b.sort_order||a.created_at.localeCompare(b.created_at));
 const at=group.findIndex(x=>x.id===id),to=at+(dir==="up"?-1:1);if(to<0||to>=group.length){toast("Already at the end of this group.");return;}
 const reorder=[...group];[reorder[at],reorder[to]]=[reorder[to],reorder[at]];
 for(let i=0;i<reorder.length;i++){const r=await sb.from("checklists").update({sort_order:i+1}).eq("id",reorder[i].id);if(r.error){err(r.error);return;}}
 toast("Checklist order updated.");await sync();
}
async function saveChecklist(x){
 const title=x.title.trim(),lines=x.tasks.split(/\r?\n/).map(y=>y.trim()).filter(Boolean);
 if(lines.length===0)throw new Error("Add at least one task.");
 if(lines.some(y=>y.length<2||y.length>300))throw new Error("Each task must be between 2 and 300 characters.");
 if(lines.length>150)throw new Error("A checklist can have up to 150 tasks.");
 let c=s.editor==="new"?null:s.checklists.find(y=>y.id===s.editor);
 const payload={title,description:x.description.trim(),category:x.category,frequency:x.frequency,shift:x.shift};
 let id;
 if(c){
  const r=await sb.from("checklists").update(payload).eq("id",c.id).select("id").single();if(r.error)throw r.error;id=c.id;
 }else{
  const r=await sb.from("checklists").insert({...payload,sort_order:s.checklists.length+1}).select("id").single();if(r.error)throw r.error;id=r.data.id;
 }
 const prev=c?ct(c):[];
 for(let i=0;i<lines.length;i++){
  if(prev[i]){
   if(prev[i].label!==lines[i]||prev[i].position!==i){const r=await sb.from("checklist_items").update({label:lines[i],position:i}).eq("id",prev[i].id);if(r.error)throw r.error;}
  }else{
   const r=await sb.from("checklist_items").insert({checklist_id:id,label:lines[i],position:i});if(r.error)throw r.error;
  }
 }
 for(const old of prev.slice(lines.length)){const r=await sb.from("checklist_items").delete().eq("id",old.id);if(r.error)throw r.error;}
 s.editor=null;s.screen="detail";s.selected=id;toast(c?"Checklist saved.":"Checklist created.");await sync();
}
async function saveTemperature(x){
 const t=Number(x.temperature_f),min=x.min_f===""?null:Number(x.min_f),max=x.max_f===""?null:Number(x.max_f),notes=x.corrective_action.trim();
 if(min!==null&&max!==null&&min>max)throw new Error("Minimum must be below maximum.");
 if(((min!==null&&t<min)||(max!==null&&t>max))&&!notes)throw new Error("Document a corrective action for an out-of-range reading.");
 const r=await sb.from("temperature_logs").insert({area:x.area.trim(),item_name:x.item_name.trim(),temperature_f:t,min_f:min,max_f:max,corrective_action:notes});
 if(r.error)throw r.error;
 s.tempModal=false;toast("Temperature recorded.");await sync();
}
sb.auth.onAuthStateChange((event,session)=>{if(event==="SIGNED_OUT"){s.user=null;s.profile=null;render();}});
loadingScreen();await initUser();
</script></body></html>
